<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <title>语文错字本</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+SC:wght@600;700&display=swap" rel="stylesheet" />
  <!-- Hanzi Writer -->
  <script src="https://cdn.jsdelivr.net/npm/hanzi-writer@3.5/dist/hanzi-writer.min.js"></script>
  <!-- Pinyin-Pro -->
  <script src="https://cdn.jsdelivr.net/npm/pinyin-pro@3.19.6/dist/index.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            bg: '#F0FDFA',         // 极浅薄荷青背景
            surface: '#FFFFFF',    // 纯白卡片表面
            subtle: '#CCFBF1',     // 浅青绿胶囊/次级底色
            subtleSoft: '#E6FBF6', // 柔和青绿填充
            line: '#99F6E4',       // 柔和青绿边框
            ink: '#134E4A',        // 深青黛文字色
            muted: '#0F766E',      // 次级青绿文字
            primary: '#0D9488',    // 主青绿色按钮与高亮
            primaryDark: '#0F766E',// 深青绿悬停色
            deepTeal: '#115E59',   // 深墨绿强调色
            tianzigeRed: '#DC2626' // 经典红色田字格线
          },
          fontFamily: {
            sans: ['Inter', '-apple-system', 'BlinkMacSystemFont', 'PingFang SC', 'sans-serif'],
            serif: ['"Noto Serif SC"', 'STKaiti', 'KaiTi', 'serif']
          }
        }
      }
    };
  </script>

  <style>
    body {
      background: linear-gradient(160deg, #F0FDFA 0%, #E6FBF6 50%, #F0FDF4 100%);
      color: #134E4A;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
      -webkit-user-select: none;
      overflow-x: hidden;
    }
    input, textarea {
      user-select: text;
      -webkit-user-select: text;
    }

    /* 经典红色虚线田字格/米字格（保留作业本真实视觉） */
    .tianzige {
      position: relative;
      background-color: #FFFDFB;
      border: 2.5px solid #DC2626;
      border-radius: 20px;
      box-shadow: inset 0 0 18px rgba(220, 38, 38, 0.04), 0 8px 20px -6px rgba(13, 148, 136, 0.12);
      overflow: hidden;
      touch-action: none;
    }
    .tianzige-grid {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 1;
    }
    .hanzi-layer {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* 3D 翻转卡片容器 */
    .flip-perspective {
      perspective: 1500px;
    }
    .flip-card-inner {
      position: relative;
      width: 100%;
      transition: transform 0.62s cubic-bezier(0.22, 1, 0.36, 1);
      transform-style: preserve-3d;
    }
    .flip-card-inner.is-flipped {
      transform: rotateY(180deg);
    }
    .flip-face {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
      width: 100%;
    }
    .flip-face-back {
      position: absolute;
      inset: 0;
      transform: rotateY(180deg);
    }

    /* 左右滑动切题动画 */
    @keyframes slideNext {
      0% { opacity: 0.35; transform: translateX(48px) scale(0.98); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    @keyframes slidePrev {
      0% { opacity: 0.35; transform: translateX(-48px) scale(0.98); }
      100% { opacity: 1; transform: translateX(0) scale(1); }
    }
    .slide-next-anim {
      animation: slideNext 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .slide-prev-anim {
      animation: slidePrev 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .animate-fade {
      animation: fadeUp 0.24s ease-out forwards;
    }
  </style>
</head>

<body class="min-h-screen flex flex-col antialiased">

  <!-- ==================== 顶部极简三段式导航（青绿主题） ==================== -->
  <header class="pt-4 pb-2.5 px-4 flex flex-col items-center justify-center sticky top-0 z-30 bg-bg/85 backdrop-blur-md border-b border-line/50">
    <nav class="inline-flex p-1.5 rounded-2xl bg-subtle/80 border border-line shadow-xs">
      <button onclick="switchTab('review')" id="tab-btn-review"
        class="px-5 sm:px-7 py-2 rounded-xl text-sm font-semibold transition-all flex items-center gap-1.5">
        <i class="fa-solid fa-layer-group text-xs"></i>
        <span>卡片复习</span>
        <span id="nav-review-badge" class="px-1.5 py-0.2 rounded-full text-[11px] bg-primary text-white font-bold">0</span>
      </button>
      <button onclick="switchTab('entry')" id="tab-btn-entry"
        class="px-5 sm:px-7 py-2 rounded-xl text-sm font-semibold transition-all flex items-center gap-1.5">
        <i class="fa-solid fa-pen-nib text-xs"></i>
        <span>生字录入</span>
      </button>
      <button onclick="switchTab('library')" id="tab-btn-library"
        class="px-5 sm:px-7 py-2 rounded-xl text-sm font-semibold transition-all flex items-center gap-1.5">
        <i class="fa-solid fa-book-bookmark text-xs"></i>
        <span>我的字库</span>
      </button>
    </nav>
  </header>

  <!-- ==================== 主内容区 ==================== -->
  <main class="flex-1 flex flex-col justify-center max-w-4xl w-full mx-auto px-4 py-4 sm:py-6">

    <!-- ==================== 1. 卡片复习模块（左右滑动 + 田字格防误触 + 每轮字数设置 + 3D翻转） ==================== -->
    <section id="view-review" class="animate-fade">

      <!-- 空状态：所有错字均已满3次掌握 -->
      <div id="review-empty-state" class="hidden bg-surface rounded-3xl border border-line p-10 sm:p-12 text-center max-w-lg mx-auto space-y-4 shadow-sm">
        <div class="w-16 h-16 rounded-full bg-subtle text-primary mx-auto flex items-center justify-center text-2xl">
          <i class="fa-solid fa-check-double"></i>
        </div>
        <h3 class="text-xl font-serif font-bold text-ink">待复习生字已全部掌握</h3>
        <p class="text-sm text-muted">所有错字均已累计满 3 次达标并归入「已掌握」字库</p>
        <div class="pt-2 flex justify-center gap-3">
          <button onclick="switchTab('entry')" class="px-5 py-2.5 rounded-2xl bg-primary hover:bg-primaryDark text-white text-sm font-semibold transition">录入新错字</button>
          <button onclick="switchTab('library')" class="px-5 py-2.5 rounded-2xl bg-subtle hover:bg-line text-ink text-sm font-semibold transition">查看我的字库</button>
        </div>
      </div>

      <!-- 本轮完成结算卡片（当本轮设定的生字全部完成后展示） -->
      <div id="review-round-complete" class="hidden bg-surface rounded-3xl border border-line p-8 sm:p-10 text-center max-w-lg mx-auto space-y-6 shadow-md animate-fade">
        <div class="w-16 h-16 rounded-2xl bg-subtle text-primary mx-auto flex items-center justify-center text-3xl shadow-xs">
          <i class="fa-solid fa-seedling"></i>
        </div>
        <div class="space-y-1">
          <h3 class="text-2xl font-serif font-bold text-ink">本轮复习已完成！</h3>
          <p class="text-xs sm:text-sm text-muted">坚持默写与造词记忆，错字会越来越少</p>
        </div>

        <!-- 统计指标 -->
        <div class="grid grid-cols-3 gap-3 bg-bg rounded-2xl p-4 border border-line/70">
          <div>
            <div class="text-xs text-muted">本轮练习</div>
            <div id="summary-round-count" class="text-xl font-bold text-ink mt-0.5">5 字</div>
          </div>
          <div class="border-x border-line/60">
            <div class="text-xs text-muted">平均识别率</div>
            <div id="summary-avg-acc" class="text-xl font-bold text-primary mt-0.5">96%</div>
          </div>
          <div>
            <div class="text-xs text-muted">满3次新掌握</div>
            <div id="summary-mastered-count" class="text-xl font-bold text-deepTeal mt-0.5">1 字</div>
          </div>
        </div>

        <!-- 下一轮按钮 -->
        <div class="flex flex-col sm:flex-row items-center justify-center gap-3 pt-1">
          <button onclick="startNewRound(true)"
            class="w-full sm:w-auto flex-1 py-3.5 px-6 rounded-2xl bg-primary hover:bg-primaryDark text-white font-semibold text-sm shadow-sm transition active:scale-95 flex items-center justify-center gap-2">
            <i class="fa-solid fa-rotate"></i>
            <span>继续下一轮练习</span>
          </button>
          <button onclick="openRoundSettingsModal()"
            class="w-full sm:w-auto py-3.5 px-5 rounded-2xl bg-subtle hover:bg-line text-ink font-semibold text-sm transition active:scale-95">
            <i class="fa-solid fa-sliders mr-1"></i>调整每轮字数
          </button>
        </div>
      </div>

      <!-- 3D 翻转复习主舞台 -->
      <div id="review-card-stage" class="max-w-xl mx-auto relative">

        <!-- 顶部控制栏：本轮进度 + 每轮字数设置 + 重新抽题 -->
        <div class="flex items-center justify-between px-1 mb-3 gap-2">
          <!-- 左侧：当前轮次序号与圆点指示器 -->
          <div class="flex items-center gap-2.5">
            <span id="review-counter-label" class="text-xs sm:text-sm font-bold text-ink">第 1 / 5 字</span>
            <div id="round-step-dots" class="hidden sm:flex items-center gap-1.5"></div>
          </div>

          <!-- 右侧：每轮字数设置按钮 + 重新洗牌按钮 -->
          <div class="flex items-center gap-2">
            <button type="button" onclick="openRoundSettingsModal()"
              class="px-3 py-1.5 rounded-xl bg-surface hover:bg-subtle border border-line text-xs font-semibold text-ink flex items-center gap-1.5 shadow-2xs transition active:scale-95">
              <i class="fa-solid fa-gear text-primary"></i>
              <span>每轮 <strong id="round-size-label" class="text-primary">5</strong> 字</span>
            </button>
            <button type="button" onclick="startNewRound(true)" title="重新随机抽取一轮"
              class="px-3 py-1.5 rounded-xl bg-surface hover:bg-subtle border border-line text-xs font-semibold text-muted hover:text-ink flex items-center gap-1 shadow-2xs transition active:scale-95">
              <i class="fa-solid fa-shuffle text-primary"></i>
              <span>换一批</span>
            </button>
          </div>
        </div>

        <!-- 卡片外层相对定位容器（含两侧快捷切换箭头 + 左右滑动手势监听区） -->
        <div class="relative flex items-center">

          <!-- 左侧：上一字悬浮按钮 -->
          <button type="button" onclick="navigateCard(-1)" id="btn-prev-card" title="上一个生字"
            class="hidden sm:flex -left-12 absolute z-20 w-9 h-9 rounded-full bg-surface hover:bg-subtle border border-line text-ink items-center justify-center shadow-sm transition active:scale-90 disabled:opacity-30">
            <i class="fa-solid fa-chevron-left text-xs"></i>
          </button>

          <!-- 3D Flip 容器（绑定非田字格区域左右滑动事件） -->
          <div id="review-swipe-zone" class="flip-perspective w-full">
            <div id="review-flip-inner" class="flip-card-inner min-h-[545px] sm:min-h-[565px]">

              <!-- ========== 【卡片正面：空白田字格手写默写 + 识别正确率 + 造词拼音防混淆】 ========== -->
              <div class="flip-face bg-surface rounded-3xl border border-line shadow-sm p-5 sm:p-8 flex flex-col justify-between min-h-[545px] sm:min-h-[565px]">
                <!-- 正面顶部：识别正确率 + 3点掌握进度 -->
                <div>
                  <div class="flex items-center justify-between mb-3">
                    <div class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full bg-subtleSoft border border-line/80 text-xs font-medium text-ink">
                      <i class="fa-solid fa-wand-magic-sparkles text-primary text-[11px]"></i>
                      <span>识别正确率:</span>
                      <strong id="front-accuracy-val" class="text-primary font-bold">100%</strong>
                    </div>

                    <div class="flex items-center gap-1.5" title="累计掌握满3次自动归入已掌握">
                      <span class="text-xs text-muted">掌握进度</span>
                      <div id="front-progress-dots" class="flex items-center gap-1.5"></div>
                    </div>
                  </div>

                  <!-- 大号汉语拼音 & 挖空带拼音组词提示（防同音字混淆） -->
                  <div class="text-center space-y-2">
                    <div id="front-pinyin" class="text-4xl sm:text-5xl font-bold text-primary tracking-wider">bá</div>
                    <div id="front-masked-hints" class="flex flex-wrap items-center justify-center gap-2 pt-1"></div>
                  </div>
                </div>

                <!-- 正面中央：空白红色田字格（手写识别区，严格屏蔽外部滑动手势） -->
                <div class="flex flex-col items-center my-2">
                  <div id="quiz-tian-zi-ge" class="tianzige w-60 h-60 sm:w-64 sm:h-64">
                    <svg class="tianzige-grid" viewBox="0 0 100 100" preserveAspectRatio="none">
                      <line x1="0" y1="50" x2="100" y2="50" stroke="#DC2626" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.55" />
                      <line x1="50" y1="0" x2="50" y2="100" stroke="#DC2626" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.55" />
                      <line x1="0" y1="0" x2="100" y2="100" stroke="#DC2626" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.3" />
                      <line x1="100" y1="0" x2="0" y2="100" stroke="#DC2626" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.3" />
                    </svg>
                    <div id="front-quiz-box" class="hanzi-layer"></div>
                  </div>

                  <!-- 实时笔画状态 -->
                  <div class="mt-2.5 flex items-center gap-2 text-xs font-medium text-muted">
                    <span id="front-stroke-status">请在空白田字格中直接手写默写</span>
                  </div>
                </div>

                <!-- 正面底部操作栏：左右切题 + 重写/提示 + 翻转看答案 -->
                <div class="flex items-center justify-between gap-2 pt-3 border-t border-line/60">
                  <div class="flex items-center gap-1.5">
                    <button type="button" onclick="navigateCard(-1)"
                      class="sm:hidden px-2.5 py-2.5 rounded-2xl bg-subtleSoft hover:bg-subtle text-ink text-xs font-semibold transition">
                      <i class="fa-solid fa-chevron-left"></i>
                    </button>
                    <button type="button" onclick="resetFrontHandwriting()"
                      class="px-3.5 py-2.5 rounded-2xl bg-subtleSoft hover:bg-subtle text-ink text-xs sm:text-sm font-semibold transition active:scale-95">
                      <i class="fa-solid fa-eraser mr-1 text-primary"></i>重写
                    </button>
                    <button type="button" onclick="hintNextStroke()"
                      class="px-3.5 py-2.5 rounded-2xl bg-subtleSoft hover:bg-subtle text-ink text-xs sm:text-sm font-semibold transition active:scale-95">
                      <i class="fa-regular fa-lightbulb mr-1 text-primary"></i>提示一笔
                    </button>
                  </div>

                  <div class="flex items-center gap-1.5">
                    <button type="button" onclick="flipCardToBack(false)"
                      class="px-4 sm:px-5 py-2.5 rounded-2xl bg-primary hover:bg-primaryDark text-white text-xs sm:text-sm font-semibold shadow-xs transition active:scale-95 flex items-center gap-1.5">
                      <span>翻转看答案</span>
                      <i class="fa-solid fa-rotate"></i>
                    </button>
                    <button type="button" onclick="navigateCard(1)"
                      class="sm:hidden px-2.5 py-2.5 rounded-2xl bg-subtleSoft hover:bg-subtle text-ink text-xs font-semibold transition">
                      <i class="fa-solid fa-chevron-right"></i>
                    </button>
                  </div>
                </div>
              </div>

              <!-- ========== 【卡片背面：动态笔顺 + 3~5组造词 + 造句深度记忆】 ========== -->
              <div class="flip-face flip-face-back bg-surface rounded-3xl border border-line shadow-sm p-5 sm:p-8 flex flex-col justify-between min-h-[545px] sm:min-h-[565px]">
                <!-- 背面顶部：识别正确率评定结果与掌握进度 -->
                <div class="flex items-center justify-between pb-3 border-b border-line/60">
                  <div id="back-eval-badge" class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-subtle text-deepTeal">
                    <i class="fa-solid fa-circle-check text-primary"></i>
                    <span>识别正确率 100% · 掌握度 +1</span>
                  </div>
                  <div id="back-progress-dots" class="flex items-center gap-1.5"></div>
                </div>

                <!-- 背面主体：左/上田字格笔顺动画 + 右/下造词(3-5组)与造句 -->
                <div class="grid grid-cols-1 sm:grid-cols-12 gap-6 items-center my-auto py-3">
                  <!-- 田字格标准笔顺动画 (5列) -->
                  <div class="sm:col-span-5 flex flex-col items-center">
                    <div id="back-tianzige-wrapper" class="tianzige w-40 h-40 sm:w-44 sm:h-44">
                      <svg class="tianzige-grid" viewBox="0 0 100 100" preserveAspectRatio="none">
                        <line x1="0" y1="50" x2="100" y2="50" stroke="#DC2626" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.55" />
                        <line x1="50" y1="0" x2="50" y2="100" stroke="#DC2626" stroke-width="0.8" stroke-dasharray="4,3" opacity="0.55" />
                        <line x1="0" y1="0" x2="100" y2="100" stroke="#DC2626" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.3" />
                        <line x1="100" y1="0" x2="0" y2="100" stroke="#DC2626" stroke-width="0.5" stroke-dasharray="3,4" opacity="0.3" />
                      </svg>
                      <div id="back-anim-box" class="hanzi-layer"></div>
                    </div>
                    <div class="flex items-center gap-2 mt-2.5">
                      <button type="button" onclick="replayBackStroke(1)"
                        class="px-3 py-1 rounded-full bg-subtleSoft hover:bg-subtle border border-line text-xs font-medium text-ink transition">
                        <i class="fa-solid fa-play text-primary mr-1"></i>重播笔顺
                      </button>
                      <button type="button" onclick="replayBackStroke(0.4)"
                        class="px-3 py-1 rounded-full bg-subtleSoft hover:bg-subtle border border-line text-xs font-medium text-ink transition">
                        慢速
                      </button>
                    </div>
                  </div>

                  <!-- 拼音、造词(3-5组)、造句强化 (7列) -->
                  <div class="sm:col-span-7 space-y-4 text-center sm:text-left">
                    <div class="flex items-baseline justify-center sm:justify-start gap-3">
                      <span id="back-char-title" class="text-4xl font-serif font-bold text-ink">拔</span>
                      <span id="back-pinyin-title" class="text-2xl font-bold text-primary">bá</span>
                    </div>

                    <!-- 3-5组造词胶囊 -->
                    <div class="space-y-1.5">
                      <div class="text-xs font-semibold text-muted">常用造词（3-5组）</div>
                      <div id="back-words-tags" class="flex flex-wrap justify-center sm:justify-start gap-2"></div>
                    </div>

                    <!-- 记忆造句 -->
                    <div class="space-y-1.5">
                      <div class="text-xs font-semibold text-muted">记忆造句</div>
                      <div id="back-sentence-box" class="p-3.5 rounded-2xl bg-bg border border-line text-sm leading-relaxed text-ink"></div>
                    </div>
                  </div>
                </div>

                <!-- 背面底部操作栏 -->
                <div class="flex items-center justify-between gap-2 pt-3 border-t border-line/60">
                  <div class="flex items-center gap-2">
                    <button type="button" onclick="flipBackToFrontRewrite()"
                      class="px-3.5 py-2.5 rounded-2xl bg-subtleSoft hover:bg-subtle text-ink text-xs sm:text-sm font-semibold transition active:scale-95">
                      <i class="fa-solid fa-rotate-left mr-1 text-primary"></i>正面重练
                    </button>
                    <button type="button" onclick="markAsForgottenOnBack()"
                      class="px-3.5 py-2.5 rounded-2xl bg-subtleSoft hover:bg-red-50 text-muted hover:text-red-600 text-xs sm:text-sm font-semibold transition active:scale-95">
                      记错了/需重练
                    </button>
                  </div>

                  <button type="button" id="btn-back-next" onclick="handleNextOrFinishRound()"
                    class="px-5 sm:px-6 py-2.5 rounded-2xl bg-primary hover:bg-primaryDark text-white text-xs sm:text-sm font-semibold shadow-xs transition active:scale-95 flex items-center justify-center gap-2">
                    <span id="btn-back-next-text">下一个 →</span>
                  </button>
                </div>
              </div>

            </div>
          </div>

          <!-- 右侧：下一字悬浮按钮 -->
          <button type="button" onclick="navigateCard(1)" id="btn-next-card" title="下一个生字"
            class="hidden sm:flex -right-12 absolute z-20 w-9 h-9 rounded-full bg-surface hover:bg-subtle border border-line text-ink items-center justify-center shadow-sm transition active:scale-90 disabled:opacity-30">
            <i class="fa-solid fa-chevron-right text-xs"></i>
          </button>
        </div>

        <!-- 底部手势轻提示 -->
        <div class="text-center mt-2.5 text-[11px] text-muted/80">

  <script>
    const STORAGE_KEY = 'hanzi_error_book_teal_v4';
    const ROUND_SIZE_KEY = 'hanzi_round_size_v4';

    // 内置常用易错字词句字典（无任何年级字段）

      '拨': { words: ['拨打', '拨款', '挑拨', '点拨'], sentence: '经过老师耐心的指点与点拨，我终于解开了这道难题。' },

      '侯': { words: ['王侯', '诸侯', '侯爵', '封侯'], sentence: '陈胜在田间豪迈地喊道：“王侯将相宁有种乎！”' },

      '虐': { words: ['肆虐', '暴虐', '虐待', '助纣为虐'], sentence: '防风林像钢铁卫士一样，挡住了在沙漠边缘肆虐的风沙。' },
      '贯': { words: ['连贯', '全神贯注', '贯通', '如雷贯耳'], sentence: '课堂上同学们全神贯注地听讲，朗读声清脆而又连贯。' },
      '琴': { words: ['钢琴', '古琴', '琴声', '口琴'], sentence: '傍晚的校园里传来了悠扬的钢琴声，让人心情格外宁静。' },
      '炙': { words: ['脍炙人口', '炙手可热', '残羹冷炙', '炙烤'], sentence: '这首描写江南春景的古诗朗朗上口，千百年来一直脍炙人口。' },
      '初': { words: ['起初', '当初', '初夏', '和好如初'], sentence: '起初我以为这道题很难，认真画图分析后才发现并不复杂。' },
      '隆': { words: ['隆重', '轰隆', '兴隆', '隆冬'], sentence: '伴随着轰隆隆的春雷声，大地迎来了生机勃勃的春天。' },
      '暇': { words: ['闲暇', '目不暇接', '无暇顾及', '自顾不暇'], sentence: '灯会上的彩灯造型各异，令人看得眼花缭乱、目不暇接。' },
      '冕': { words: ['加冕', '冠冕堂皇', '卫冕', '日冕'], sentence: '这位运动员凭借顽强的毅力成功卫冕，再次站上了冠军领奖台。' },
      '赢': { words: ['输赢', '赢家', '共赢', '赢得'], sentence: '真正优秀的团队看重合作共赢，而不只计较一时的输赢。' }
    };

    // 初始内置的 8 个经典易错字（无年级属性）
    const INITIAL_WORDS = [
      {
        char: '拔',
        pinyin: 'bá',
        words: ['拔草', '挺拔', '选拔', '拔河'],
        sentence: '山峰高耸挺拔，同学们正在山脚下热情地比赛拔河。',
        count: 1,
        mastered: false
      },
      {
        char: '拨',
        pinyin: 'bō',
        words: ['拨打', '拨款', '挑拨', '点拨'],
        sentence: '经过老师耐心的指点与点拨，我终于解开了这道难题。',
        count: 0,
        mastered: false
      },
      {
        char: '候',
        pinyin: 'hòu',
        words: ['时候', '等候', '气候', '问候'],
        sentence: '每当过年的时候，我们都会向远方的长辈送上温暖的问候。',
        count: 2,
        mastered: false
      },
      {
        char: '具',
        pinyin: 'jù',
        words: ['文具', '具体', '玩具', '具备'],
        sentence: '出发露营前，请大家把需要携带的文具和工具清点具体。',
        count: 2,
        mastered: false
      },
      {
        char: '侯',
        pinyin: 'hóu',
        words: ['王侯', '诸侯', '侯爵', '封侯'],
        sentence: '陈胜在田间豪迈地喊道：“王侯将相宁有种乎！”',
        count: 0,
        mastered: false
      },
      {
        char: '虐',
        pinyin: 'nüè',
        words: ['肆虐', '暴虐', '虐待', '助纣为虐'],
        sentence: '防风林像钢铁卫士一样，挡住了在沙漠边缘肆虐的风沙。',
        count: 0,
        mastered: false
      },
      {
        char: '贯',
        pinyin: 'guàn',
        words: ['连贯', '全神贯注', '贯通', '如雷贯耳'],
        sentence: '课堂上同学们全神贯注地听讲，朗读声清脆而又连贯。',
        count: 1,
        mastered: false

      {
        char: '琴',
        pinyin: 'qín',
        words: ['钢琴', '古琴', '琴声', '口琴'],
        sentence: '傍晚的校园里传来了悠扬的钢琴声，让人心情格外宁静。',
        count: 0,
        mastered: false
      }
    ];

    let state = {
      tab: 'review',
      words: [],
      entryChar: '拔',
      entryWriter: null,

      // 轮次与卡片复习状态
      roundSize: 5,
      roundQueue: [],
      reviewIdx: 0,
      roundCompletedMap: {}, // char -> accuracy
      roundNewlyMastered: 0,

      frontWriter: null,
      backWriter: null,
      currentMistakes: 0,
      currentTotalStrokes: 8,
      lastAccuracy: 100,
      hasEvaluatedCurrent: false,
      incrementedOnCurrent: false,

      // 字库筛选状态
      libStatus: 'learning',
      modalWriter: null
    };

    /**
     * ============================================================================
     * 存储、拼音与高亮辅助
     * ============================================================================
     */
    function loadWords() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        state.words = raw ? JSON.parse(raw) : JSON.parse(JSON.stringify(INITIAL_WORDS));
        // 清理可能残留的旧版字段
        state.words.forEach(w => { delete w.grade; delete w.stage; });
      } catch (e) {
        state.words = JSON.parse(JSON.stringify(INITIAL_WORDS));
      }

      const savedSize = parseInt(localStorage.getItem(ROUND_SIZE_KEY), 10);
      if (!isNaN(savedSize) && savedSize >= 1) {
        state.roundSize = savedSize;
      }
      document.getElementById('round-size-label').textContent = state.roundSize;
      updateBadges();
    }

    function saveWords() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state.words));
      updateBadges();
    }

    function updateBadges() {
      const learningCount = state.words.filter(w => !w.mastered).length;
      const masteredCount = state.words.filter(w => w.mastered).length;
      const allCount = state.words.length;
      document.getElementById('nav-review-badge').textContent = learningCount;
      document.getElementById('lib-count-learning').textContent = learningCount;
      document.getElementById('lib-count-mastered').textContent = masteredCount;
      document.getElementById('lib-count-all').textContent = allCount;
    }

    function getPinyin(text, contextWords = []) {
      if (!text) return '';
      try {
        if (window.pinyinPro) {
          const { pinyin } = window.pinyinPro;
          if (text.length === 1 && contextWords.length > 0) {
            for (const w of contextWords) {
              const idx = w.indexOf(text);
              if (idx !== -1 && w.length > 1) {
                const arr = pinyin(w, { type: 'array', toneType: 'symbol' });
                if (arr && arr[idx]) return arr[idx];
              }
            }
          }
          return pinyin(text, { toneType: 'symbol' });
        }
      } catch (e) {}
      return '';
    }

    function parseWordArray(str) {
      if (Array.isArray(str)) return str;
      return (str || '').split(/[,，、\s/]+/).map(s => s.trim()).filter(Boolean);
    }

    function renderDotsHtml(count = 0) {
      return [0, 1, 2].map(i => {
        const active = i < count;
        return `<span class="w-2.5 h-2.5 rounded-full ${active ? 'bg-primary' : 'bg-line'} transition-all"></span>`;
      }).join('');
    }

    function highlightTargetChar(text, targetChar) {
      if (!text || !targetChar) return text || '';
      return text.replaceAll(
        targetChar,
        `<span class="text-primary font-bold underline decoration-primary/40 underline-offset-4 px-0.5">${targetChar}</span>`
      );
    }

    /**
     * ============================================================================
     * 模块 1：卡片复习（每轮字数设置 + 左右滑动切换 + 空白田字格屏蔽滑动）
     * ============================================================================
     */
    function shuffleArray(arr) {
      const a = [...arr];
      for (let i = a.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [a[i], a[j]] = [a[j], a[i]];
      }
      return a;
    }

    // 开启新一轮学习
    function startNewRound(showToastMsg = false, specificCharFirst = null) {
      const unmastered = state.words.filter(w => !w.mastered);
      const emptyEl = document.getElementById('review-empty-state');
      const completeEl = document.getElementById('review-round-complete');
      const stageEl = document.getElementById('review-card-stage');

      completeEl.classList.add('hidden');

      if (unmastered.length === 0) {
        emptyEl.classList.remove('hidden');
        stageEl.classList.add('hidden');
        return;
      }

      emptyEl.classList.add('hidden');
      stageEl.classList.remove('hidden');

      let pool = shuffleArray(unmastered.map(w => w.char));
      if (specificCharFirst && pool.includes(specificCharFirst)) {
        pool = [specificCharFirst, ...pool.filter(c => c !== specificCharFirst)];
      }

      state.roundQueue = pool.slice(0, Math.min(state.roundSize, pool.length));
      state.reviewIdx = 0;
      state.roundCompletedMap = {};
      state.roundNewlyMastered = 0;

      if (showToastMsg) {
        showToast(`已开启新一轮复习（共 ${state.roundQueue.length} 字）`);
      }
      loadCurrentReviewCard();
    }

    // 渲染顶部本轮进度圆点
    function renderRoundStepDots() {
      const container = document.getElementById('round-step-dots');
      if (!container) return;
      container.innerHTML = state.roundQueue.map((c, idx) => {
        const done = state.roundCompletedMap[c] !== undefined;
        const isCurrent = idx === state.reviewIdx;
        if (isCurrent) {
          return `<button onclick="jumpToRoundIdx(${idx})" class="w-5 h-2 rounded-full bg-primary transition-all"></button>`;
        }
        return `<button onclick="jumpToRoundIdx(${idx})" class="w-2 h-2 rounded-full ${done ? 'bg-primary/60' : 'bg-line'} hover:bg-primary transition-all"></button>`;
      }).join('');
    }

    function jumpToRoundIdx(idx) {
      if (idx < 0 || idx >= state.roundQueue.length || idx === state.reviewIdx) return;
      const dir = idx > state.reviewIdx ? 1 : -1;
      state.reviewIdx = idx;
      triggerSlideTransition(dir);
      loadCurrentReviewCard();
    }

    // 左右切换当前轮次中的上一个 / 下一个生字
    function navigateCard(delta) {
      if (!state.roundQueue.length) return;
      const nextIdx = state.reviewIdx + delta;
      if (nextIdx < 0) {
        showToast('已经是本轮第一个生字');
        return;
      }
      if (nextIdx >= state.roundQueue.length) {
        showRoundCompleteSummary();
        return;
      }
      state.reviewIdx = nextIdx;
      triggerSlideTransition(delta);
      loadCurrentReviewCard();
    }

    function triggerSlideTransition(dir) {
      const zone = document.getElementById('review-swipe-zone');
      if (!zone) return;
      zone.classList.remove('slide-next-anim', 'slide-prev-anim');
      void zone.offsetWidth;
      zone.classList.add(dir > 0 ? 'slide-next-anim' : 'slide-prev-anim');
    }

    function loadCurrentReviewCard() {
      if (state.roundQueue.length === 0) {
        startNewRound(false);
        return;
      }

      const currentChar = state.roundQueue[state.reviewIdx];
      const item = state.words.find(w => w.char === currentChar);
      if (!item) return;

      document.getElementById('review-flip-inner').classList.remove('is-flipped');
      state.hasEvaluatedCurrent = false;
      state.incrementedOnCurrent = false;

      // 更新顶部计数器与两侧按钮可用状态
      document.getElementById('review-counter-label').textContent = `第 ${state.reviewIdx + 1} / ${state.roundQueue.length} 字`;
      document.getElementById('round-size-label').textContent = state.roundSize;
      renderRoundStepDots();

      const prevBtn = document.getElementById('btn-prev-card');
      if (prevBtn) prevBtn.disabled = state.reviewIdx === 0;

      const isLastInRound = state.reviewIdx === state.roundQueue.length - 1;
      document.getElementById('btn-back-next-text').textContent = isLastInRound ? '完成本轮' : '下一个 →';

      // 正面信息：掌握度 + 大号拼音 + 挖空带拼音组词提示
      document.getElementById('front-progress-dots').innerHTML = renderDotsHtml(item.count || 0);
      document.getElementById('front-pinyin').textContent = item.pinyin;

      const hintWords = (item.words || []).slice(0, 3);
      document.getElementById('front-masked-hints').innerHTML = hintWords.map(w => {
        const wordPy = getPinyin(w);
        const masked = w.replaceAll(item.char, '<span class="text-primary font-bold">【 □ 】</span>');
        return `
          <span class="px-3 py-1 rounded-xl bg-bg border border-line text-xs sm:text-sm font-medium text-ink">
            ${masked} <span class="text-muted text-xs">(${wordPy})</span>
          </span>
        `;
      }).join('');

      // 背面信息：3-5组带拼音造词 + 记忆造句
      document.getElementById('back-char-title').textContent = item.char;
      document.getElementById('back-pinyin-title').textContent = item.pinyin;
      document.getElementById('back-words-tags').innerHTML = (item.words || []).map(w => {
        const wPy = getPinyin(w);
        return `
          <div class="px-3 py-1.5 rounded-xl bg-subtleSoft border border-line/70 text-center">
            <div class="text-[10px] text-muted leading-tight">${wPy}</div>
            <div class="text-xs sm:text-sm font-semibold text-ink">${highlightTargetChar(w, item.char)}</div>
          </div>
        `;
      }).join('');
      document.getElementById('back-sentence-box').innerHTML = highlightTargetChar(item.sentence || '', item.char);

      // 初始化正面空白田字格手写测验
      initFrontBlankQuiz(item);
    }

    function initFrontBlankQuiz(item) {
      const box = document.getElementById('front-quiz-box');
      box.innerHTML = '';
      state.currentMistakes = 0;
      state.lastAccuracy = 100;

      document.getElementById('front-stroke-status').textContent = '请在空白田字格中直接手写默写';
      const accEl = document.getElementById('front-accuracy-val');
      accEl.textContent = '100%';
      accEl.className = 'text-primary font-bold';

      const size = Math.min(box.clientWidth || 232, box.clientHeight || 232) - 16;

      state.frontWriter = HanziWriter.create(box, item.char, {
        width: size,
        height: size,
        padding: 10,
        showCharacter: false,
        showOutline: false,
        showHintAfterMisses: 2,
        highlightOnComplete: true,
        strokeColor: '#134E4A',
        drawingColor: '#0D9488',
        drawingWidth: 24,
        onLoadCharDataSuccess: (charData) => {
          state.currentTotalStrokes = (charData && charData.strokes && charData.strokes.length) || 8;
        }
      });

      state.frontWriter.quiz({
        onMistake: (strokeData) => {
          state.currentMistakes = strokeData.totalMistakes;
          const acc = computeAccuracy(state.currentTotalStrokes, state.currentMistakes);
          state.lastAccuracy = acc;
          updateFrontAccuracyUI(acc, `第 ${strokeData.strokeNum + 1} 笔有误，请重试`);
        },
        onCorrectStroke: (strokeData) => {
          const acc = computeAccuracy(state.currentTotalStrokes, strokeData.totalMistakes);
          state.lastAccuracy = acc;
          updateFrontAccuracyUI(acc, `已写对 ${strokeData.strokeNum + 1} / ${state.currentTotalStrokes} 笔`);
        },
        onComplete: (summaryData) => {
          const acc = computeAccuracy(state.currentTotalStrokes, summaryData.totalMistakes);
          state.lastAccuracy = acc;
          playSuccessChime();
          updateFrontAccuracyUI(acc, '书写完成，正在翻转卡片...');
          setTimeout(() => {
            flipCardToBack(true);
          }, 500);
        }
      });
    }

    // 轻柔完成提示音效（Web Audio API 合成，零外部音频依赖）
    function playSuccessChime() {
      try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (!AudioCtx) return;
        const ctx = new AudioCtx();
        const notes = [523.25, 659.25, 783.99];
        notes.forEach((freq, idx) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0.06, ctx.currentTime + idx * 0.07);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.07 + 0.22);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start(ctx.currentTime + idx * 0.07);
          osc.stop(ctx.currentTime + idx * 0.07 + 0.24);
        });
      } catch (e) {}
    }

    function hintNextStroke() {
      if (!state.frontWriter) return;
      state.currentMistakes += 1;
      const acc = computeAccuracy(state.currentTotalStrokes, state.currentMistakes);
      state.lastAccuracy = acc;
      updateFrontAccuracyUI(acc, '已闪现下一笔提示');
      if (typeof state.frontWriter.highlightStroke === 'function') {
        state.frontWriter.showOutline();
        setTimeout(() => {
          if (state.frontWriter) state.frontWriter.hideOutline();
        }, 650);
      }
    }

    function computeAccuracy(totalStrokes, mistakes) {
      const denom = Math.max(totalStrokes + mistakes, 1);
      return Math.max(0, Math.round((totalStrokes / denom) * 100));
    }

    function updateFrontAccuracyUI(acc, statusText) {
      document.getElementById('front-stroke-status').textContent = statusText;
      const accEl = document.getElementById('front-accuracy-val');
      accEl.textContent = `${acc}%`;
      accEl.className = acc >= 80 ? 'text-primary font-bold' : 'text-red-600 font-bold';
    }

    function resetFrontHandwriting() {
      const currentChar = state.roundQueue[state.reviewIdx];
      const item = state.words.find(w => w.char === currentChar);
      if (item) initFrontBlankQuiz(item);
    }

    function flipCardToBack(completedByWriting) {
      const currentChar = state.roundQueue[state.reviewIdx];
      const item = state.words.find(w => w.char === currentChar);
      if (!item) return;

      const badgeEl = document.getElementById('back-eval-badge');

      if (!state.hasEvaluatedCurrent) {
        state.hasEvaluatedCurrent = true;
        state.roundCompletedMap[currentChar] = completedByWriting ? state.lastAccuracy : 80;

        if (completedByWriting && state.lastAccuracy >= 80) {
          item.count = (item.count || 0) + 1;
          state.incrementedOnCurrent = true;
          if (item.count >= 3) {
            item.count = 3;
            item.mastered = true;
            state.roundNewlyMastered += 1;
            badgeEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-primary text-white';
            badgeEl.innerHTML = `<i class="fa-solid fa-award"></i><span>识别正确率 ${state.lastAccuracy}% · 满 3 次已掌握！</span>`;
          } else {
            badgeEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-subtle text-deepTeal';
            badgeEl.innerHTML = `<i class="fa-solid fa-circle-check text-primary"></i><span>识别正确率 ${state.lastAccuracy}% · 掌握度 ${item.count}/3</span>`;
          }
        } else if (completedByWriting) {
          badgeEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-red-50 text-red-600';
          badgeEl.innerHTML = `<i class="fa-solid fa-circle-exclamation"></i><span>识别正确率 ${state.lastAccuracy}% · 需强化记忆 (${item.count || 0}/3)</span>`;
        } else {
          badgeEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-subtleSoft text-muted';
          badgeEl.innerHTML = `<i class="fa-solid fa-eye text-primary"></i><span>查看答案与造词造句 (${item.count || 0}/3)</span>`;
        }
        saveWords();
        renderRoundStepDots();
      }

      document.getElementById('back-progress-dots').innerHTML = renderDotsHtml(item.count || 0);
      document.getElementById('review-flip-inner').classList.add('is-flipped');

      setTimeout(() => {
        replayBackStroke(1);
      }, 260);
    }

    function markAsForgottenOnBack() {
      const currentChar = state.roundQueue[state.reviewIdx];
      const item = state.words.find(w => w.char === currentChar);
      if (!item) return;

      if (item.mastered && state.roundNewlyMastered > 0) {
        state.roundNewlyMastered -= 1;
      }
      item.count = 0;
      item.mastered = false;
      state.incrementedOnCurrent = false;
      saveWords();

      const badgeEl = document.getElementById('back-eval-badge');
      badgeEl.className = 'inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-red-50 text-red-600';
      badgeEl.innerHTML = `<i class="fa-solid fa-rotate-left"></i><span>已重置掌握进度 (0/3)</span>`;
      document.getElementById('back-progress-dots').innerHTML = renderDotsHtml(0);
      showToast('已重置该字掌握进度为 0/3');
    }

    function replayBackStroke(speed = 1) {
      const currentChar = state.roundQueue[state.reviewIdx];
      if (!currentChar) return;
      const box = document.getElementById('back-anim-box');
      box.innerHTML = '';
      const size = Math.min(box.clientWidth || 165, box.clientHeight || 165) - 12;

      state.backWriter = HanziWriter.create(box, currentChar, {
        width: size,
        height: size,
        padding: 8,
        showOutline: true,
        strokeAnimationSpeed: speed,
        delayBetweenStrokes: speed < 1 ? 400 : 180,
        strokeColor: '#134E4A',
        radicalColor: '#0D9488',
        outlineColor: '#CCFBF1',
        onLoadCharDataSuccess: () => {
          state.backWriter.animateCharacter();
        }
      });
    }

    function flipBackToFrontRewrite() {
      document.getElementById('review-flip-inner').classList.remove('is-flipped');
      setTimeout(() => {
        resetFrontHandwriting();
      }, 240);
    }

    function handleNextOrFinishRound() {
      if (state.reviewIdx < state.roundQueue.length - 1) {
        navigateCard(1);
      } else {
        showRoundCompleteSummary();
      }
    }

    function showRoundCompleteSummary() {
      document.getElementById('review-card-stage').classList.add('hidden');
      const completeEl = document.getElementById('review-round-complete');
      completeEl.classList.remove('hidden');

      const practicedCount = state.roundQueue.length;
      const accValues = Object.values(state.roundCompletedMap);
      const avgAcc = accValues.length
        ? Math.round(accValues.reduce((a, b) => a + b, 0) / accValues.length)
        : 100;

      document.getElementById('summary-round-count').textContent = `${practicedCount} 字`;
      document.getElementById('summary-avg-acc').textContent = `${avgAcc}%`;
      document.getElementById('summary-mastered-count').textContent = `${state.roundNewlyMastered} 字`;
    }

    /**
     * ============================================================================
     * 左右滑动手势绑定（严格屏蔽田字格手写区域）
     * ============================================================================
     */
    function setupCardSwipeGestures() {
      const swipeZone = document.getElementById('review-swipe-zone');
      const quizWrapper = document.getElementById('quiz-tian-zi-ge');
      const backWrapper = document.getElementById('back-tianzige-wrapper');

      // 关键：在田字格区域内阻止冒泡，确保手指/Apple Pencil 书写绝不触发左右切题
      [quizWrapper, backWrapper].forEach(el => {
        if (!el) return;
        ['touchstart', 'touchmove', 'touchend', 'pointerdown', 'mousedown'].forEach(evtName => {
          el.addEventListener(evtName, (e) => {
            e.stopPropagation();
          }, { passive: true });
        });
      });

      let startX = 0;
      let startY = 0;
      let isTracking = false;

      swipeZone.addEventListener('touchstart', (e) => {
        if (e.target.closest('#quiz-tian-zi-ge') || e.target.closest('#back-tianzige-wrapper')) {
          isTracking = false;
          return;
        }
        if (e.touches.length === 1) {
          startX = e.touches[0].clientX;
          startY = e.touches[0].clientY;
          isTracking = true;
        }
      }, { passive: true });

      swipeZone.addEventListener('touchend', (e) => {
        if (!isTracking || e.changedTouches.length === 0) return;
        isTracking = false;
        const dx = e.changedTouches[0].clientX - startX;
        const dy = e.changedTouches[0].clientY - startY;

        // 水平位移大于 55px 且明显大于垂直位移时触发左右切换生字
        if (Math.abs(dx) > 55 && Math.abs(dx) > Math.abs(dy) * 1.4) {
          if (dx < 0) {
            navigateCard(1); // 向左滑 -> 下一个生字
          } else {
            navigateCard(-1); // 向右滑 -> 上一个生字
          }
        }
      }, { passive: true });
    }

    /**
     * ============================================================================
     * 每轮学习字数设置弹窗
     * ============================================================================
     */
    function openRoundSettingsModal() {
      document.getElementById('round-settings-modal').classList.remove('hidden');
      document.getElementById('custom-round-size').value = state.roundSize;
      highlightSelectedRoundSizeBtn();
    }

    function closeRoundSettingsModal() {
      document.getElementById('round-settings-modal').classList.add('hidden');
    }

    function highlightSelectedRoundSizeBtn() {
      document.querySelectorAll('.round-size-btn').forEach(btn => {
        const val = parseInt(btn.getAttribute('data-size'), 10);
        if (val === state.roundSize) {
          btn.className = 'round-size-btn py-2.5 rounded-2xl border border-primary bg-primary text-white text-sm font-semibold shadow-xs transition';
        } else {
          btn.className = 'round-size-btn py-2.5 rounded-2xl border border-line bg-subtleSoft hover:bg-subtle text-ink text-sm font-semibold transition';
        }
      });
    }

    function selectRoundSize(size) {
      state.roundSize = Math.max(1, parseInt(size, 10) || 5);
      localStorage.setItem(ROUND_SIZE_KEY, state.roundSize);
      document.getElementById('round-size-label').textContent = state.roundSize;
      closeRoundSettingsModal();
      startNewRound(true);
    }

    function applyCustomRoundSize() {
      const val = parseInt(document.getElementById('custom-round-size').value, 10);
      if (isNaN(val) || val < 1) {
        showToast('请输入有效的每轮字数');
        return;
      }
      selectRoundSize(Math.min(val, 100));
    }

    /**
     * ============================================================================
     * 模块 2：生字录入（极简无年级）
     * ============================================================================
     */
    function renderEntryWriter(char, speed = 1) {
      const box = document.getElementById('entry-hanzi-box');
      if (!box || !char) return;
      box.innerHTML = '';
      const size = Math.min(box.clientWidth || 200, box.clientHeight || 200) - 16;

      state.entryWriter = HanziWriter.create(box, char, {
        width: size,
        height: size,
        padding: 8,
        showOutline: true,
        strokeAnimationSpeed: speed,
        delayBetweenStrokes: speed < 1 ? 400 : 180,
        strokeColor: '#134E4A',
        radicalColor: '#0D9488',
        outlineColor: '#CCFBF1',
        onLoadCharDataSuccess: () => {
          state.entryWriter.animateCharacter();
        }
      });
    }

    function onEntryCharInput() {
      const raw = document.getElementById('entry-char').value.trim();
      const char = (raw.match(/[\u4e00-\u9fa5]/) || [])[0];
      if (!char) return;

      document.getElementById('entry-char').value = char;
      state.entryChar = char;

      const dictItem = BUILTIN_DICT[char];
      const wordsInput = document.getElementById('entry-words');
      const sentenceInput = document.getElementById('entry-sentence');

      if (dictItem) {
        wordsInput.value = dictItem.words.join(', ');
        sentenceInput.value = dictItem.sentence;
      } else {
        wordsInput.value = `${char}字, 组${char}, 学${char}`;
        sentenceInput.value = `今天我认真练习了「${char}」字的笔画顺序。`;
      }

      const py = getPinyin(char, parseWordArray(wordsInput.value));
      document.getElementById('entry-pinyin').value = py;
      document.getElementById('entry-preview-pinyin').textContent = py;

      renderEntryWriter(char, 1);
    }

    function onEntryWordsChange() {
      const char = (document.getElementById('entry-char').value.match(/[\u4e00-\u9fa5]/) || [])[0];
      if (!char) return;
      const words = parseWordArray(document.getElementById('entry-words').value);
      const py = getPinyin(char, words);
      if (py) {
        document.getElementById('entry-pinyin').value = py;
        document.getElementById('entry-preview-pinyin').textContent = py;
      }
    }

    function replayEntryStroke(speed = 1) {
      if (state.entryChar) renderEntryWriter(state.entryChar, speed);
    }

    function saveEntryWord() {
      const char = (document.getElementById('entry-char').value.match(/[\u4e00-\u9fa5]/) || [])[0];
      if (!char) {
        showToast('请先输入一个汉字');
        return;
      }
      const words = parseWordArray(document.getElementById('entry-words').value);
      if (words.length === 0) {
        showToast('请填写至少 1 个组词');
        return;
      }
      const pinyin = document.getElementById('entry-pinyin').value.trim() || getPinyin(char, words);
      const sentence = document.getElementById('entry-sentence').value.trim() || `请认真记住「${char}」字的写法。`;

      const idx = state.words.findIndex(w => w.char === char);
      if (idx !== -1) {
        state.words[idx] = { char, pinyin, words, sentence, count: 0, mastered: false };
        showToast(`已更新「${char}」并重置复习进度`);
      } else {
        state.words.unshift({ char, pinyin, words, sentence, count: 0, mastered: false });
        showToast(`已将「${char}」加入错字本`);
      }

      saveWords();
      document.getElementById('entry-char').value = '';
      document.getElementById('entry-words').value = '';
      document.getElementById('entry-sentence').value = '';
    }

    /**
     * ============================================================================
     * 模块 3：我的字库（无年级分类）
     * ============================================================================
     */
    function setLibraryStatus(status) {
      state.libStatus = status;
      const tabs = {
        learning: document.getElementById('lib-tab-learning'),
        mastered: document.getElementById('lib-tab-mastered'),
        all: document.getElementById('lib-tab-all')
      };

      Object.keys(tabs).forEach(k => {
        if (!tabs[k]) return;
        if (k === status) {
          tabs[k].className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold bg-primary text-white shadow-2xs transition';
        } else {
          tabs[k].className = 'px-3.5 py-1.5 rounded-lg text-xs sm:text-sm font-semibold text-muted hover:text-ink transition';
        }
      });
      renderLibraryGrid();
    }

    function renderLibraryGrid() {
      const query = (document.getElementById('lib-search-input')?.value || '').trim().toLowerCase();

      const list = state.words.filter(w => {
        if (state.libStatus === 'learning' && w.mastered) return false;
        if (state.libStatus === 'mastered' && !w.mastered) return false;
        if (query) {
          const hitChar = w.char.includes(query);
          const hitPy = (w.pinyin || '').toLowerCase().includes(query);
          const hitWords = (w.words || []).some(wd => wd.includes(query));
          return hitChar || hitPy || hitWords;
        }
        return true;
      });

      const grid = document.getElementById('library-grid');
      if (list.length === 0) {
        grid.innerHTML = `
          <div class="col-span-full bg-surface rounded-3xl border border-line p-12 text-center text-sm text-muted">
            当前列表下暂无生字
          </div>
        `;
        return;
      }

      grid.innerHTML = list.map(item => `
        <div onclick="openDetailModal('${item.char}')"
          class="bg-surface rounded-2xl border border-line hover:border-primary p-4 cursor-pointer transition shadow-2xs hover:shadow-md flex flex-col justify-between gap-3">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-primary">${item.pinyin}</span>
            ${
              item.mastered
                ? `<span class="text-[11px] font-semibold text-deepTeal bg-subtle px-2 py-0.5 rounded-full">已掌握</span>`
                : `<div class="flex items-center gap-1">${renderDotsHtml(item.count || 0)}</div>`
            }
          </div>

          <div class="text-center my-1">
            <div class="text-4xl font-serif font-bold text-ink">${item.char}</div>
          </div>

          <div class="text-xs text-muted text-center truncate">
            ${(item.words || []).slice(0, 3).join(' · ')}
          </div>
        </div>
      `).join('');
    }

    function openDetailModal(char) {
      const item = state.words.find(w => w.char === char);
      if (!item) return;

      document.getElementById('modal-char').textContent = item.char;
      document.getElementById('modal-pinyin').textContent = item.pinyin;
      document.getElementById('modal-dots').innerHTML = renderDotsHtml(item.count || 0);
      document.getElementById('modal-words').innerHTML = (item.words || []).map(w =>
        `<span class="px-2.5 py-1 rounded-lg bg-subtleSoft border border-line/70 text-xs font-medium">${highlightTargetChar(w, item.char)}</span>`
      ).join('');
      document.getElementById('modal-sentence').innerHTML = highlightTargetChar(item.sentence || '', item.char);

      document.getElementById('modal-practice-btn').onclick = () => {
        item.mastered = false;
        saveWords();
        closeDetailModal();
        switchTab('review', item.char);
      };

      const toggleBtn = document.getElementById('modal-toggle-status-btn');
      if (item.mastered) {
        toggleBtn.textContent = '移回待复习';
        toggleBtn.onclick = () => {
          item.mastered = false;
          item.count = 0;
          saveWords();
          renderLibraryGrid();
          closeDetailModal();
          showToast(`已将「${item.char}」移回待复习`);
        };
      } else {
        toggleBtn.textContent = '标为已掌握';
        toggleBtn.onclick = () => {
          item.mastered = true;
          item.count = 3;
          saveWords();
          renderLibraryGrid();
          closeDetailModal();
          showToast(`已将「${item.char}」归入已掌握`);
        };
      }

      document.getElementById('modal-delete-btn').onclick = () => {
        state.words = state.words.filter(w => w.char !== item.char);
        saveWords();
        renderLibraryGrid();
        closeDetailModal();
        showToast(`已删除「${item.char}」`);
      };

      document.getElementById('detail-modal').classList.remove('hidden');

      const box = document.getElementById('modal-hanzi-box');
      box.innerHTML = '';
      setTimeout(() => {
        state.modalWriter = HanziWriter.create(box, item.char, {
          width: 156,
          height: 156,
          padding: 8,
          showOutline: true,
          strokeColor: '#134E4A',
          radicalColor: '#0D9488',
          outlineColor: '#CCFBF1',
          onLoadCharDataSuccess: () => state.modalWriter.animateCharacter()
        });
      }, 40);
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
    }

    /**
     * ============================================================================
     * 字库批量导入/导出 & Web 工具箱通信桥
     * ============================================================================
     */
    function openImportModal() {
      document.getElementById('import-modal').classList.remove('hidden');
    }

    function closeImportModal() {
      document.getElementById('import-modal').classList.add('hidden');
    }

    function confirmImportJson() {
      const raw = document.getElementById('import-json-input').value.trim();
      if (!raw) {
        showToast('请粘贴 JSON 数组');
        return;
      }
      try {
        const arr = JSON.parse(raw);
        if (!Array.isArray(arr)) throw new Error('Not array');
        let count = 0;
        arr.forEach(entry => {
          const char = ((entry.char || '').match(/[\u4e00-\u9fa5]/) || [])[0];
          if (!char) return;
          const words = parseWordArray(entry.words || BUILTIN_DICT[char]?.words || [char]);
          const pinyin = entry.pinyin || getPinyin(char, words);
          const sentence = entry.sentence || BUILTIN_DICT[char]?.sentence || `练习书写「${char}」字。`;

          if (!state.words.some(w => w.char === char)) {
            state.words.push({
              char,
              pinyin,
              words,
              sentence,
              count: entry.count || 0,
              mastered: Boolean(entry.mastered)
            });
            count++;
          }
        });
        saveWords();
        renderLibraryGrid();
        closeImportModal();
        showToast(`成功导入 ${count} 个生字`);
      } catch (e) {
        showToast('JSON 格式有误，请检查');
      }
    }

    function exportJsonData() {
      const blob = new Blob([JSON.stringify(state.words, null, 2)], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `语文错字本_${new Date().toISOString().slice(0, 10)}.json`;
      a.click();
      URL.revokeObjectURL(url);
    }

    function restoreInitialWords() {
      state.words = JSON.parse(JSON.stringify(INITIAL_WORDS));
      saveWords();
      renderLibraryGrid();
      closeImportModal();
      showToast('已恢复默认演示字库');
    }

    /**
     * ============================================================================
     * 顶部分段 Tab 切换与初始化
     * ============================================================================
     */
    function switchTab(tab, focusChar = null) {
      state.tab = tab;
      ['review', 'entry', 'library'].forEach(t => {
        document.getElementById(`view-${t}`).classList.toggle('hidden', t !== tab);
        const btn = document.getElementById(`tab-btn-${t}`);
        if (t === tab) {
          btn.className = 'px-5 sm:px-7 py-2 rounded-xl text-sm font-semibold bg-surface text-deepTeal shadow-xs transition-all flex items-center gap-1.5';
        } else {
          btn.className = 'px-5 sm:px-7 py-2 rounded-xl text-sm font-semibold text-muted hover:text-ink transition-all flex items-center gap-1.5';
        }
      });

      if (tab === 'entry') {
        setTimeout(() => renderEntryWriter(state.entryChar || '拔', 1), 30);
      } else if (tab === 'review') {
        startNewRound(false, focusChar);
      } else if (tab === 'library') {
        renderLibraryGrid();
      }
    }

    function showToast(msg) {
      const box = document.getElementById('toast-box');
      if (!box) return;
      const item = document.createElement('div');
      item.className = 'px-4 py-2.5 rounded-2xl bg-deepTeal text-white text-xs sm:text-sm font-medium shadow-lg animate-fade mb-2';
      item.textContent = msg;
      box.innerHTML = '';
      box.appendChild(item);
      setTimeout(() => {
        if (box.contains(item)) box.removeChild(item);
      }, 2200);
    }

    // 支持外部 Web 工具箱 postMessage 桥接
    window.addEventListener('message', (event) => {
      const data = event.data;
      if (!data || typeof data !== 'object') return;
      if (data.type === 'HANZI_TOOLBOX_IMPORT' && Array.isArray(data.payload)) {
        document.getElementById('import-json-input').value = JSON.stringify(data.payload);
        confirmImportJson();
      }
    });

    // 页面加载初始化
    window.addEventListener('DOMContentLoaded', () => {
      loadWords();
      setupCardSwipeGestures();
      setLibraryStatus('learning');
      switchTab('review');
    });
  </script>
</body>
</html>
